<div class="card p-4">
  <h2 class="text-2xl font-bold mb-4">Gestione Pazienti</h2>

  <div class="flex justify-content-between mb-4">
    <span class="p-input-icon-left w-full md:w-20rem">
      <i class="pi pi-search"></i>
      <input 
        pInputText 
        type="text" 
        class="w-full"
        placeholder="Cerca per nome o braccialetto..." 
        [(ngModel)]="nomeFiltro" />
    </span>
  </div>

  <p-table 
    [value]="pazientiFiltrati()" 
    [rows]="5" 
    [paginator]="true" 
    responsiveLayout="stack" 
    breakpoint="960px"
    styleClass="p-datatable-striped">
    
    <ng-template pTemplate="header">
      <tr>
        <th>Paziente</th>
        <th>Braccialetto</th>
        <th>Codice Colore</th>
        <th>Età</th>
        <th>Azioni</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-pz>
      <tr>
        <td>
          <span class="p-column-title font-bold">Paziente</span>
          <div class="font-bold text-900">{{pz.cognome}} {{pz.nome}}</div>
          <div class="text-xs text-500 italic">{{pz.patologia}}</div>
        </td>
        <td>
          <span class="p-column-title font-bold">Braccialetto</span>
          {{pz.braccialetto}}
        </td>
        <td>
          <span class="p-column-title font-bold">Stato</span>
          <p-tag [value]="pz.codiceColore" [severity]="getSeverity(pz.codiceColore)"></p-tag>
        </td>
        <td>
          <span class="p-column-title font-bold">Età</span>
          {{pz.eta}} anni
        </td>
        <td>
          <div class="flex gap-2">
            <p-button 
                icon="pi pi-refresh" 
                severity="success" 
                [rounded]="true" 
                [text]="true" 
                (onClick)="cambiaNome()">
            </p-button>
            <p-button 
                icon="pi pi-trash" 
                severity="danger" 
                [rounded]="true" 
                [text]="true">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center p-4 text-500">
          Nessun paziente trovato con questi criteri.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
