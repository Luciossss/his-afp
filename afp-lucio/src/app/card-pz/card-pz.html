<p-card [styleClass]="'card-clinica ' + setColoreDiStato()">
  <ng-template pTemplate="header">
    <div class="p-3 border-bottom-1 border-50">
      <div class="text-xl font-bold text-900 uppercase">{{paziente().cognome}} {{paziente().nome}}</div>
      <div class="text-xs font-semibold text-500 mt-1 uppercase">{{paziente().braccialetto}}</div>
    </div>
  </ng-template>

  <div class="flex flex-column gap-3 py-2 text-900">
    <div class="flex flex-column">
      <span class="text-xs font-bold text-400 uppercase">Patologia</span>
      <span class="font-medium">{{paziente().patologia}}</span>
    </div>

    <div class="flex flex-column border-top-1 border-50 pt-2">
      <span class="text-xs font-bold text-400 uppercase">Note Cliniche</span>
      <span class="text-sm text-700 italic">{{paziente().note}}</span>
    </div>

    <div class="flex justify-content-between pt-2 border-top-1 border-50 align-items-center">
      <span class="text-xs font-bold text-400 uppercase">Età</span>
      <span class="font-bold text-lg text-900">{{paziente().eta}} anni</span>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end pt-2">
      <p-button label="Dimetti" severity="danger" [text]="true" size="small"></p-button>
    </div>
  </ng-template>
</p-card>
